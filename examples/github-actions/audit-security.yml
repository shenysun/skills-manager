# Copy-paste CI gate for a skills-manager hub repo.
# Repo root (or `defaults.run.working-directory`) must already be a hub:
#   skills/          +  registry.yaml
# Do NOT pass `--home` here — an explicit home auto-creates a missing hub,
# which would make an empty scan exit 0 and hide a misconfigured job.
#
# Fails only on severity=high findings; warn/info never fail.
# Requires skills-manager-cli with `audit security --strict`
# (on main since 2026-10-26; use @latest after that npm cut).

name: skills-manager audit security

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  audit:
    runs-on: ubuntu-latest
    # Nested hub? uncomment:
    # defaults:
    #   run:
    #     working-directory: path/to/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit skill hub (fail on high)
        run: npx --yes skills-manager-cli audit security --strict
